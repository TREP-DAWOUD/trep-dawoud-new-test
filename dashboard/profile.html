<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - TREP DAWOUD</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-page">

<nav class="navbar">
    <div class="container">
        <div class="navbar-brand"><span class="logo">⛏️ TREP DAWOUD</span></div>
        <button class="mobile-menu-toggle">☰</button>
        <ul class="nav-links">
            <li><a href="/">الرئيسية</a></li>
            <li><a href="/pages/about.html">من نحن</a></li>
            <li><a href="/auth/login.html">دخول</a></li>
            <nav class="navbar">
    <div class="container">
        <div class="navbar-brand"><span class="logo">⛏️ TREP DAWOUD</span></div>
        <button class="mobile-menu-toggle">☰</button>
        <ul class="nav-links"><li><a href="/">الرئيسية</a></li><li><button class="theme-toggle">🌙</button></li></ul>
    </div>
</nav>
        </ul>
    </div>
</nav>

<main class="container" style="margin-top: 100px;">
    <div class="dashboard-container" style="display: grid; grid-template-columns: 250px 1fr; gap: 30px; max-width: 1200px; margin: 0 auto;">
        
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-user">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='20' fill='%231a472a'/%3E%3Cpath d='M 20 100 Q 50 70 80 100' fill='%231a472a'/%3E%3C/svg%3E" alt="صورتي" style="width: 80px; height: 80px; border-radius: 50%; margin-bottom: 15px;">
                <h3>أحمد محمد</h3>
                <p style="color: var(--color-text-light);">عضو منذ يناير 2024</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard/index.html" class="nav-item">📊 لوحة التحكم</a>
                <a href="/dashboard/profile.html" class="nav-item active">👤 الملف الشخصي</a>
                <a href="/dashboard/bookings.html" class="nav-item">📅 الحجوزات</a>
                <a href="/dashboard/courses.html" class="nav-item">📚 الدورات</a>
                <a href="/dashboard/settings.html" class="nav-item">⚙️ الإعدادات</a>
                <a href="#logout" class="nav-item logout">🚪 خروج</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="dashboard-content">
            <h1>الملف الشخصي</h1>
            
            <div class="card" style="margin-bottom: 30px;">
                <h2 style="margin-bottom: 20px;">معلومات شخصية</h2>
                <form style="display: grid; gap: 20px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <label>الاسم الأول *</label>
                            <input type="text" placeholder="أحمد" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                        </div>
                        <div>
                            <label>الاسم الأخير *</label>
                            <input type="text" placeholder="محمد" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                        </div>
                    </div>

                    <div>
                        <label>البريد الإلكتروني *</label>
                        <input type="email" placeholder="ahmed@example.com" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <div>
                        <label>رقم الهاتف</label>
                        <input type="tel" placeholder="+966 50 123 4567" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <div>
                        <label>تاريخ الميلاد</label>
                        <input type="date" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <div>
                        <label>البيو (نبذة عنك)</label>
                        <textarea placeholder="أخبرنا عن نفسك..." rows="4" style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px; resize: vertical;"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: fit-content;">💾 حفظ التغييرات</button>
                </form>
            </div>

            <div class="card" style="margin-bottom: 30px;">
                <h2 style="margin-bottom: 20px;">تغيير كلمة المرور</h2>
                <form style="display: grid; gap: 20px; max-width: 500px;">
                    <div>
                        <label>كلمة المرور الحالية *</label>
                        <input type="password" placeholder="••••••••" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <div>
                        <label>كلمة المرور الجديدة *</label>
                        <input type="password" placeholder="••••••••" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <div>
                        <label>تأكيد كلمة المرور *</label>
                        <input type="password" placeholder="••••••••" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: fit-content;">🔐 تحديث كلمة المرور</button>
                </form>
            </div>

            <div class="card">
                <h2 style="margin-bottom: 20px;">عنوان التسليم الافتراضي</h2>
                <form style="display: grid; gap: 20px;">
                    <div>
                        <label>العنوان *</label>
                        <input type="text" placeholder="شارع..." required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div>
                            <label>المدينة *</label>
                            <input type="text" placeholder="الطائف" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                        </div>
                        <div>
                            <label>الرمز البريدي *</label>
                            <input type="text" placeholder="26516" required style="width: 100%; padding: 10px; border: 1px solid var(--color-border); border-radius: 4px;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: fit-content;">💾 حفظ العنوان</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2026 TREP DAWOUD - جميع الحقوق محفوظة</p>
        </div>
    </div>
</footer>

<style>
    .dashboard-container {
        margin-bottom: 50px;
    }

    .dashboard-sidebar {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        height: fit-content;
        position: sticky;
        top: 100px;
    }

    html.dark-mode .dashboard-sidebar {
        background: var(--color-bg);
    }

    .sidebar-user {
        text-align: center;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--color-border);
    }

    .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin-top: 20px;
    }

    .nav-item {
        padding: 12px 15px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--color-text);
        transition: all 300ms;
        display: block;
    }

    .nav-item:hover {
        background: var(--color-bg-light);
        color: var(--color-accent);
    }

    .nav-item.active {
        background: var(--color-accent);
        color: white;
    }

    .nav-item.logout:hover {
        background: #ef4444;
        color: white;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    html.dark-mode .card {
        background: var(--color-bg);
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--color-primary);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="password"],
    textarea {
        font-family: inherit;
        font-size: 1rem;
    }

    html.dark-mode input,
    html.dark-mode textarea {
        background: var(--color-bg-light);
        color: var(--color-text);
    }

    @media (max-width: 768px) {
        .dashboard-container {
            grid-template-columns: 1fr;
        }

        .dashboard-sidebar {
            position: static;
        }

        .sidebar-nav {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        label {
            font-size: 0.9rem;
        }

        form > div {
            grid-template-columns: 1fr !important;
        }
    }
</style>

<script src="/js/main.js"></script>
</body>
</html>
