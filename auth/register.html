<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - TREP DAWOUD</title>
    <link rel="canonical" href="https://trepdawoud.com/auth/register.html">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="contact-page">

<nav class="navbar">
    <div class="navbar-container container">
        <div class="navbar-brand">⛏️ TREP DAWOUD</div>
        <div class="navbar-controls">
            <button class="theme-toggle">🌙</button>
        </div>
    </div>
</nav>

<section class="section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div style="max-width: 500px; margin: 0 auto; background: var(--bg-secondary); padding: 2rem; border-radius: 12px; box-shadow: var(--shadow-md);">
            <h2 style="text-align: center; margin-bottom: 2rem;">إنشاء حساب جديد</h2>

            <form class="form-validate">
                <div class="form-group">
                    <label for="fullname">الاسم الكامل</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="أحمد محمد علي">
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+966501234567">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" minlength="8">
                </div>

                <div class="form-group">
                    <label for="confirm-password">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="country">الدولة</label>
                    <select id="country" name="country" required>
                        <option value="">-- اختر الدولة --</option>
                        <option value="sa">المملكة العربية السعودية</option>
                        <option value="ae">الإمارات العربية المتحدة</option>
                        <option value="kw">الكويت</option>
                        <option value="bh">البحرين</option>
                        <option value="qa">قطر</option>
                        <option value="om">عمان</option>
                        <option value="ye">اليمن</option>
                    </select>
                </div>

                <div style="display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 1.5rem;">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree" style="margin: 0; font-size: 0.9rem;">
                        أوافق على <a href="/pages/terms.html">الشروط والأحكام</a> و<a href="/pages/privacy.html">سياسة الخصوصية</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-bottom: 1rem;">إنشاء حساب</button>

                <div style="text-align: center; color: var(--text-secondary);">
                    لديك حساب بالفعل؟ <a href="/auth/login.html" style="color: var(--primary-color); font-weight: 600;">دخول</a>
                </div>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="footer-bottom">
        <p>&copy; 2024 TREP DAWOUD. جميع الحقوق محفوظة</p>
    </div>
</footer>

<script src="/js/main.js"></script>
</body>
</html>
